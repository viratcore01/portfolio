name: Sync README + snapshots

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync LeetCode snapshot
        run: node scripts/update-leetcode.mjs

      - name: Sync projects from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-readme.mjs --profile

      - name: Commit if changed
        run: |
          git config user.name "readme-bot"
          git config user.email "readme-bot@users.noreply.github.com"
          git add README.md PROFILE-README.live.md public/projects.snapshot.json public/leetcode.snapshot.json
          git diff --cached --quiet || git commit -m "chore: auto-sync README + projects snapshot [skip ci]"
          git push
